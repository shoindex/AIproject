<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trello風タスク管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>タスクボード</h1>

  <div class="board">
    <div class="column">
      <h2>未着手</h2>
      <div class="card-list"></div>
      <div class="add-form">
        <input type="text" class="card-input" placeholder="タスクを入力">
        <button class="add-btn">追加</button>
      </div>
    </div>

    <div class="column">
      <h2>進行中</h2>
      <div class="card-list"></div>
      <div class="add-form">
        <input type="text" class="card-input" placeholder="タスクを入力">
        <button class="add-btn">追加</button>
      </div>
    </div>

    <div class="column">
      <h2>完了</h2>
      <div class="card-list"></div>
      <div class="add-form">
        <input type="text" class="card-input" placeholder="タスクを入力">
        <button class="add-btn">追加</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
